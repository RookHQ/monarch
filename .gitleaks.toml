# Gitleaks settings for Monarch.
#
# The files below hold made-up sample keys in docs demos, tests, previews and catalogue
# pages for the key components (KeyCreatedDialog, ApiKeyRow, SecretField, KeyValue,
# InstallVerify and others). They look like Stripe, webhook or PEM keys on purpose so the
# components can be shown and tested; none is a real credential. Every other file is scanned
# with the default rules.

[extend]
useDefault = true

[allowlist]
description = "Sample keys in component demos and tests"
paths = [
  '''^packages/react/src/components/data\-display/key\-value/key\-value\.docs\.tsx$''',
  '''^packages/react/src/components/data\-display/tree\-view/tree\-view\.docs\.tsx$''',
  '''^packages/react/src/components/files/block\-editor/block\-editor\.docs\.tsx$''',
  '''^packages/react/src/components/forms/number\-input/number\-input\.docs\.tsx$''',
  '''^packages/react/src/components/intelligence/ai\-computer\-view/ai\-computer\-view\.docs\.tsx$''',
  '''^packages/react/src/components/technical/api\-key\-row/api\-key\-row\.docs\.tsx$''',
  '''^packages/react/src/components/technical/install\-verify/install\-verify\.docs\.tsx$''',
  '''^packages/react/src/components/technical/key\-created\-dialog/key\-created\-dialog\.docs\.tsx$''',
  '''^packages/react/src/components/technical/key\-created\-dialog/key\-created\-dialog\.fixture\.json$''',
  '''^packages/react/src/components/technical/key\-created\-dialog/key\-created\-dialog\.test\.tsx$''',
  '''^platforms/android/monarch\-compose/src/debug/kotlin/(?:dev/monarchui|com/rookhq/monarch)/components/technical/keycreateddialog/MonarchKeyCreatedDialogPreviews\.kt$''',
  '''^platforms/android/monarch\-compose/src/test/kotlin/(?:dev/monarchui|com/rookhq/monarch)/components/technical/MonarchApiKeyRowTest\.kt$''',
  '''^platforms/android/monarch\-compose/src/test/kotlin/(?:dev/monarchui|com/rookhq/monarch)/components/technical/MonarchKeyCreatedDialogTest\.kt$''',
  '''^platforms/android/monarch\-compose/src/test/kotlin/(?:dev/monarchui|com/rookhq/monarch)/components/typography/MonarchInlineCodeStyleTest\.kt$''',
  '''^platforms/android/sample/src/main/kotlin/(?:dev/monarchui|com/rookhq/monarch)/sample/sections/technical/MonarchKeyCreatedDialogSection\.kt$''',
  '''^platforms/ios/Sample/Sources/Sections/Technical/MonarchKeyCreatedDialogSection\.swift$''',
  '''^platforms/ios/Sample/Sources/Sections/Technical/MonarchSecretFieldSection\.swift$''',
  '''^platforms/ios/Sources/MonarchUI/Components/Technical/MonarchKeyCreatedDialog/MonarchKeyCreatedDialog\.swift$''',
  '''^platforms/ios/Tests/MonarchUITests/Components/Technical/MonarchApiKeyRowTests\.swift$''',
  '''^platforms/ios/Tests/MonarchUITests/Components/Technical/MonarchKeyCreatedDialogTests\.swift$''',
  '''^platforms/ios/Tests/MonarchUITests/Generated/Examples/TechnicalExamples\.generated\.swift$''',
  '''^platforms/android/sample/src/main/kotlin/(?:dev/monarchui|com/rookhq/monarch)/sample/sections/technical/MonarchSecretFieldSection\.kt$''',
  '''^platforms/ios/Tests/MonarchUITests/Components/DataDisplay/MonarchKeyValueTests\.swift$''',
]
