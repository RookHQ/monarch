# XcodeGen spec of the preview host: a small app that shows ONE inventory example, full bleed on the
# theme's canvas, for the documentation previews. Scripts/build-previews.sh generates the project,
# builds it, launches it once per component and theme, takes a simulator screenshot and crops it.
# The examples are the compiled inventory examples the tests already use; nothing is copied.
name: MonarchPreviewHost
options:
  bundleIdPrefix: com.rookhq.monarch
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  Monarch:
    path: ..
targets:
  MonarchPreviewHost:
    type: application
    platform: iOS
    sources:
      - Sources
      # The docs landing page's category tiles and hero cards, shared with the catalogue app.
      - path: ../Sample/Sources/Showcase
      - path: ../Tests/MonarchUITests/Generated/Examples
      # The cross-platform scenario fixtures (scripts/native/fixtures.mjs), for showcases.
      - path: ../Tests/MonarchUITests/Generated/Fixtures
      - path: ../Tests/MonarchUITests/Support/InventoryExample.swift
    dependencies:
      - package: Monarch
        product: MonarchUI
      - package: Monarch
        product: MonarchTokens
      - package: Monarch
        product: MonarchFontsPoppins
    settings:
      base:
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_SWIFT_FLAGS: '-enable-upcoming-feature ExistentialAny'
        PRODUCT_BUNDLE_IDENTIFIER: com.rookhq.monarch.previewhost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monarch previews
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_NSCameraUsageDescription: Some examples list your cameras.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Some examples use your microphone.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Some examples turn speech into text.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: Some examples show the tracking prompt.
