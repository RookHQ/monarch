# XcodeGen specification for the catalogue app.
# Generate the project with:  xcodegen generate --spec Sample/project.yml
# The generated MonarchCatalogue.xcodeproj is not committed.
name: MonarchCatalogue
options:
  bundleIdPrefix: dev.monarchui
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  Monarch:
    path: ..
targets:
  MonarchCatalogue:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Monarch
        product: MonarchUI
      - package: Monarch
        product: MonarchTokens
      # The docs showcase screen and landing compositions (Sources/Showcase) are set in Poppins, like the docs previews.
      - package: Monarch
        product: MonarchFontsPoppins
    settings:
      base:
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: dev.monarchui.catalogue
        MARKETING_VERSION: 0.14.5
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monarch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1,2'
        # Permission prompts of the catalogue pages that use the real system APIs: the device
        # picker (camera and microphone), voice input (speech recognition) and the consent
        # manager (App Tracking Transparency). Without them iOS ends the app on the request.
        INFOPLIST_KEY_NSCameraUsageDescription: The device picker page lists your cameras.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: The device picker and voice input pages use your microphone.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: The voice input page turns your speech into text.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: The consent manager page shows the system tracking prompt. The catalogue does not track you.
