# The only place a version is written. See README.md ("Updating versions").

[versions]
# Monarch for Android itself (group dev.monarchui).
monarch = "0.14.5"

# Toolchain.
jdk = "21"
jvmTarget = "17"
compileSdk = "37"
targetSdk = "37"
minSdk = "24"

# Build plugins.
agp = "9.5.1"
kotlin = "2.4.21"
detekt = "1.23.8"
binaryCompatibilityValidator = "0.18.2"
# API reference (HTML) for the docs site, /android/api/.
dokka = "2.3.0"
# Publications, signing and the Maven Central (Central Portal) upload.
mavenPublish = "0.37.0"

# Libraries.
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# Not used directly. Raises the transitive lifecycle-runtime 2.9.4 of Compose, whose bundled lint
# checks cannot be loaded by the lint of AGP 9.5 (ObsoleteLintCustomCheck).
lifecycle = "2.11.0"
# Declared because components call it directly (for example CodeSnippetTabsSync); Compose only
# brings it in transitively. The same version Compose resolves today.
coreKtx = "1.19.1"
# The system emoji picker behind MonarchEmojiPicker.
emojiPicker = "1.7.0"

# Test libraries.
junit = "4.13.2"
robolectric = "4.18"
androidxTestCore = "1.7.0"
# Not used directly. compose-ui-test-junit4 pulls in Espresso 3.5.0, which calls an API that Android 14
# removed (InputManager.getInstance) and fails under Robolectric on current SDK levels.
espresso = "3.7.0"
# Screenshot tests on the JVM (Robolectric, native graphics).
roborazzi = "1.78.0"

[libraries]
# Compose artifacts take their versions from the BOM.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# Material icons (Apache-2.0) for inventory examples and tests only; never a dependency of the library.
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
# Adaptive layouts: window size classes, list-detail and supporting panes, and the navigation
# suite that switches between a bar and a rail. Versions come from the BOM.
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive" }
compose-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout" }
compose-material3-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation" }
compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-emoji2-emojipicker = { module = "androidx.emoji2:emoji2-emojipicker", version.ref = "emojiPicker" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

# Gradle plugins as dependencies of build-logic.
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-compose-compiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
plugin-binary-compatibility-validator = { module = "org.jetbrains.kotlinx:binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
plugin-detekt = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
plugin-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
plugin-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
plugin-roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }
