# detekt rules for Monarch for Android. Builds on detekt's default rule set.
# Only differences from the defaults are listed, each with its reason.
#
# Analysed: src/main, src/debug, src/test and src/testDebug of every module.
# Not analysed: generated sources under build/ and the generated MonarchTokens.kt, MonarchGlyphs.kt and
# ParityFixtures.kt.
# `./gradlew componentCheck -Pcomponent=<name>` applies the same rules to the
# files of one component.

config:
  validation: true
  warningsAsErrors: true

naming:
  FunctionNaming:
    # Composable functions that emit UI are named like types (Compose API guidelines).
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Compose API guidelines name top-level constants in PascalCase.
    constantPattern: '[A-Z][A-Za-z0-9]*'
  VariableNaming:
    # MonarchSpacing mirrors the generated token names, which include half steps such as space0_5.
    variablePattern: '[a-z][A-Za-z0-9]*(_[0-9]+)?'

complexity:
  LongParameterList:
    # MonarchTypography has one constructor parameter per type role (nine).
    constructorThreshold: 10
    # Composable functions expose their options as parameters with defaults.
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    # A composable's body is a declarative tree; length is not branching.
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true
    # A test file holds the fixtures object and the test class of one component.
    ignoreAnnotated: ['Preview', 'MonarchPreviews', 'Test']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview', 'MonarchPreviews']
    excludes: ['**/src/test/**']
  UnusedPrivateMember:
    # Preview functions are private and only called by Android Studio.
    ignoreAnnotated: ['Preview', 'MonarchPreviews']
  ReturnCount:
    max: 3
  ForbiddenComment:
    active: true
  MaxLineLength:
    maxLineLength: 120
