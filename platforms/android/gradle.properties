# Memory. A clean Android build needs about 7 GB of free RAM: the Gradle daemon (3 GB: R8 and
# lint ran out of memory at 2 GB), the Kotlin compile daemon (4 GB: compileDebugKotlin and
# compileReleaseKotlin run in parallel in it, and a clean verifyMonarch --rerun-tasks ran out of
# memory at 3 GB) and one Robolectric test JVM (1 GB, build-logic). Dokka, when asked for, runs
# in its own 2 GB JVM. On a 16 GB Mac that fits one heavy build per platform at a time;
# ubuntu-24.04 runners have 16 GB, and CI reads these values from this file.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official

# AGP 9.5.1 registers a Compose Preview task for every variant and that task
# needs the variant's unit test component. Without this, `./gradlew tasks`
# fails for the release variant. Release unit tests are switched off again in
# build-logic (monarch.android.*), so tests still run once.
android.onlyEnableUnitTestForTheTestedBuildType=false
