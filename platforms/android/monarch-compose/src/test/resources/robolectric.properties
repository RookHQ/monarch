# Robolectric settings for every test in monarch-compose (C-052).
#
# US English, so dates, times and numbers written through ICU and DateUtils
# read the same on every machine, whatever the locale of the computer or the
# CI runner. A test that needs another locale or a night, RTL or size
# qualifier still sets its own with @Config(qualifiers = ...).
qualifiers=en-rUS
# The SDK of the Android framework the tests run against: compileSdk and
# targetSdk in gradle/libs.versions.toml. Update both together.
sdk=37
