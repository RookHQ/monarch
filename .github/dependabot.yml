version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 8
    labels: [dependencies]
    # Groups carry only low-risk updates; every major arrives as its own PR
    # so it can be reviewed and verified on its own.
    groups:
      radix:
        patterns: ['@radix-ui/*']
        update-types: [minor, patch]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types track the Node line we run (.nvmrc = 22), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Playwright must match the CI container tag (mcr.microsoft.com/playwright:vX-noble);
      # bump both together by hand.
      - dependency-name: '@playwright/test'
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
