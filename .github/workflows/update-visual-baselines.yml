name: Update visual baselines
# MAINTAINERS ONLY. This workflow is manual (workflow_dispatch), so only people
# with write access to the repository can start it; it cannot be triggered by a
# pull request from a fork, and it needs write access to push to the branch.
# External contributors do not run it: a maintainer regenerates the baselines on
# the contributor's branch (docs/guides/visual-testing.md).
#
# Run from a branch (Actions tab, or `gh workflow run update-visual-baselines.yml --ref <branch>`).
# It regenerates the Linux screenshots (the docs site in the pinned container, and
# the Android Roborazzi baselines that Native / android compares on Linux) and
# commits the files that changed back to that branch, so nobody downloads and
# copies images by hand. docs/guides/visual-testing.md describes the flow.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-visual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    # Runs the branch's code (npm ci, build, tests), so it only gets a read-only token.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    # Same as the CI docs job: the site is built AND served under this base,
    # so the setting must apply to every step, not only the test step.
    env:
      DOCS_BASE: /monarch/
      # Container jobs run as root with HOME=/github/home (owned by pwuser);
      # Firefox refuses to start in that case.
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:docs
      - name: Regenerate Linux baselines
        run: npm run test:visual:update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: apps/docs/tests/__screenshots__/visual
          retention-days: 3
  android:
    # Records the Android screenshot baselines on the same runner image as Native / android.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('platforms/android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - name: Record Android baselines
        run: >
          ./gradlew recordScreenshots --stacktrace
          -Dorg.gradle.internal.repository.max.retries=6
          -Dorg.gradle.internal.repository.initial.backoff=5000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-baselines
          path: platforms/android/monarch-compose/src/test/screenshots/**/*.png
          retention-days: 3
  commit:
    # Never executes the branch's code: it only copies PNG files and runs git.
    needs: [render, android]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: visual-baselines, path: /tmp/baselines }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: android-baselines, path: /tmp/android-baselines }
      - name: Accept only Linux PNG baselines
        run: |
          bad=$(find /tmp/baselines \( -type l -o \( -type f ! -name '*-linux.png' \) \))
          if [ -n "$bad" ]; then echo "Unexpected files in the artifact:"; echo "$bad"; exit 1; fi
          bad=$(find /tmp/android-baselines \( -type l -o \( -type f ! -name '*.png' \) \))
          if [ -n "$bad" ]; then echo "Unexpected files in the Android artifact:"; echo "$bad"; exit 1; fi
      - name: Copy baselines and commit what changed
        run: |
          dest=apps/docs/tests/__screenshots__/visual
          cp -R /tmp/baselines/. "$dest"/
          git add "$dest"
          android=platforms/android/monarch-compose/src/test/screenshots
          cp -R /tmp/android-baselines/. "$android"/
          git add "$android"
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update Linux visual baselines" -m "Generated by the Update visual baselines workflow (run ${{ github.run_id }})."
          git push origin "HEAD:refs/heads/${BRANCH}"
          # Pushes made with GITHUB_TOKEN do not start pull_request checks; dispatching
          # CI explicitly is allowed and puts the checks on the new commit.
          gh workflow run ci.yml --ref "${BRANCH}"
          gh workflow run native.yml --ref "${BRANCH}"
