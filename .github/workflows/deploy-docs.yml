name: Deploy docs

# Builds the docs site on a throwaway GitHub runner, then uploads only the finished files over
# SSH to the production web root. The server runs no build and no Node process. The deploy key
# is a GitHub *environment* secret (production, main branch only), is locked on the server to
# one write-only rsync into one directory, and never reaches a pull request or a fork.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'registry/**'
      - 'docs/**'
      - 'scripts/docs/**'
      - 'deploy/docs-site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCS_SITE_URL: https://monarchui.dev
  DEPLOY_HOST: srv2073313.hstgr.cloud
  DEPLOY_USER: monarchui-deploy

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      # No install scripts: a compromised dependency cannot run code during the build.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run build:docs
      - run: npm run docs:budget
      - run: npm run docs:links
      # Fails if the pages need a script hash the server's policy does not allow.
      - run: npm run docs:csp
      - name: Verify build output
        run: |
          test -s apps/docs/dist/index.html
          test -s apps/docs/dist/404.html
          grep -q 'https://monarchui.dev/' apps/docs/dist/sitemap.xml
          ! find apps/docs/dist -type l | grep -q .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to monarchui.dev
    needs: build
    # Repository variable, so the pipeline can merge before the server is ready.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://monarchui.dev
    steps:
      # Pinned known_hosts comes from the repository, not from the network.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: deploy/docs-site
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: out
      - name: Upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          rsync -rptz --delete --delay-updates --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/deploy/docs-site/known_hosts" \
            out/ "$DEPLOY_USER@$DEPLOY_HOST:./"
          shred -u "$HOME/.ssh/deploy_key" || rm -f "$HOME/.ssh/deploy_key"
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 https://monarchui.dev/ | grep -q 'Meet Monarch'; then
              curl -fsSI --max-time 15 https://monarchui.dev/ | grep -qi '^content-security-policy:' \
                && curl -fsSIL --max-time 15 -o /dev/null -w '%{url_effective}\n' https://monarch.rookhq.com/ | grep -q '^https://monarchui.dev/' \
                && { echo "Live: content, CSP header and redirect are correct."; exit 0; }
            fi
            sleep 10
          done
          echo "::error::monarchui.dev did not pass the post-deploy checks."; exit 1
