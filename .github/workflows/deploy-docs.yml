name: Deploy docs

# Builds the docs site on a throwaway GitHub runner, then uploads only the finished files over
# SSH to the production web root. The server runs no build and no Node process. The deploy key
# is a GitHub *environment* secret (production, main branch only), is locked on the server to
# one write-only rsync into one directory, and never reaches a pull request or a fork.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'registry/**'
      - 'docs/**'
      - 'scripts/docs/**'
      - 'deploy/docs-site/**'
      # The generated API references of the native libraries (/ios/api/, /android/api/).
      - 'platforms/ios/Sources/**'
      - 'platforms/android/monarch-*/src/main/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCS_SITE_URL: https://monarchui.dev

jobs:
  # API reference of Monarch for iOS (DocC), published at /ios/api/.
  api-ios:
    name: API reference (iOS, DocC)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # The Xcode of the Native workflow (docs/architecture/NATIVE-COMPATIBILITY.md).
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: platforms/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the documentation archive
        run: |
          xcodebuild docbuild -scheme MonarchUI -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode-docs CODE_SIGNING_ALLOWED=NO >.build-docs.log 2>&1 \
            || { grep -E 'error:' .build-docs.log; tail -n 80 .build-docs.log; exit 1; }
      - name: Transform for static hosting at /ios/api/
        run: |
          archive="$(find .build/xcode-docs -type d -name 'MonarchUI.doccarchive' | head -n 1)"
          test -n "$archive"
          xcrun docc process-archive transform-for-static-hosting "$archive" \
            --output-path "$RUNNER_TEMP/api-ios" --hosting-base-path ios/api
          test -s "$RUNNER_TEMP/api-ios/index.html"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-ios
          path: ${{ runner.temp }}/api-ios
          if-no-files-found: error
          retention-days: 7

  # API reference of Monarch for Android (Dokka HTML of both libraries), published at /android/api/.
  api-android:
    name: API reference (Android, Dokka)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { cache-read-only: true }
      - name: Dokka HTML
        run: |
          ./gradlew dokkaGeneratePublicationHtml --stacktrace
          test -s build/dokka/html/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-android
          path: platforms/android/build/dokka/html
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build docs site
    needs: [api-ios, api-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      # No install scripts: a compromised dependency cannot run code during the build.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run build:docs
        env:
          DOCS_GTM_ID: ${{ vars.DOCS_GTM_ID }}
          DOCS_CLARITY_ID: ${{ vars.DOCS_CLARITY_ID }}
      - run: npm run docs:budget
      - run: npm run docs:links
      # Fails if the pages need a script hash the server's policy does not allow.
      - run: npm run docs:csp
      # Titles, descriptions, share image, structured data, content in the HTML, Markdown copies.
      - run: npm run docs:seo
      # The generated API references go in after the site checks above, which cover the
      # pages the docs app builds. Their own links stay inside each tree.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-ios
          path: apps/docs/dist/ios/api
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-android
          path: apps/docs/dist/android/api
      - name: Verify build output
        run: |
          test -s apps/docs/dist/index.html
          test -s apps/docs/dist/404.html
          grep -q 'https://monarchui.dev/' apps/docs/dist/sitemap.xml
          test -s apps/docs/dist/ios/api/index.html
          test -s apps/docs/dist/android/api/index.html
          ! find apps/docs/dist -type l | grep -q .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: apps/docs/dist
          if-no-files-found: error
          # /.well-known/security.txt lives in a hidden folder; artifacts skip those by default.
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to monarchui.dev
    needs: build
    # Repository variable, so the pipeline can merge before the server is ready.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://monarchui.dev
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: out
      - name: Upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The server address, account and pinned host key live in the `production`
          # environment, not in this public repository (deploy/docs-site/README.md).
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::The production environment secret $v is not set (deploy/docs-site/README.md)."; exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          # The host key is pinned from the secret, never learned from the network.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          rsync -rptz --delete --delay-updates --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            out/ "$DEPLOY_USER@$DEPLOY_HOST:./"
          shred -u "$HOME/.ssh/deploy_key" || rm -f "$HOME/.ssh/deploy_key"
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 https://monarchui.dev/ | grep -q 'Meet Monarch'; then
              curl -fsSI --max-time 15 https://monarchui.dev/ | grep -qi '^content-security-policy:' \
                && curl -fsSIL --max-time 15 -o /dev/null -w '%{url_effective}\n' https://monarch.rookhq.com/ | grep -q '^https://monarchui.dev/' \
                && { echo "Live: content, CSP header and redirect are correct."; exit 0; }
            fi
            sleep 10
          done
          echo "::error::monarchui.dev did not pass the post-deploy checks."; exit 1
