name: Label pull requests
# Adds `category: …` and `area: …` labels from the files a pull request changes (.github/labeler.yml).
# pull_request_target so it can label pull requests from forks. It never checks out or runs the pull
# request's code: it reads only the list of changed files.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
